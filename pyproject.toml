[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conflictlens"
version = "0.1.0"
description = "Conflict-aware answerability policy for enterprise retrieval"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.9,<3", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "ruff>=0.7,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
